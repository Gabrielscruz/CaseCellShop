# Configuração do RabbitMQ para CaseCellShop
listeners.tcp.default = 5672
management.tcp.port = 15672

default_user = casecellshop
default_pass = casecellshop_pwd
default_vhost = /

loopback_users.guest = false

# Limites de recursos para estabilidade sob picos de checkout
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.0
