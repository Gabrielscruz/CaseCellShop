# Configuração do Redis para CaseCellShop
# Persistência AOF ativada para durabilidade dos locks e dados
appendonly yes
appendfsync everysec

# Limite de memória e política de eviction para cache distribuído
maxmemory 256mb
maxmemory-policy allkeys-lru

# Timeout de conexões inativas (segundos)
timeout 300

# Porta padrão
port 6379
